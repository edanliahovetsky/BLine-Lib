name: Test and Package

on:
  pull_request:
    branches: [wpilib-2027]
  push:
    branches: [wpilib-2027]
    tags: ['v2027.*']

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test, and publish to Maven local
        run: ./gradlew build publishToMavenLocal --no-daemon
        env:
          GRADLE_OPTS: -Dmaven.repo.local=${{ runner.temp }}/m2
